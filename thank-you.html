<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - TechnoTouch Interio</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#FAF8F5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{text-align:center;max-width:480px;width:100%;background:#fff;border-radius:16px;padding:56px 40px;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#C49A3C,#d4aa4f);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;animation:pop .5s ease}
.icon i{font-size:36px;color:#fff}
@keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
h1{font-family:'Playfair Display',serif;font-size:32px;color:#2C2C2C;margin-bottom:12px}
p{font-size:15px;color:#888;line-height:1.7;margin-bottom:8px}
.highlight{color:#C49A3C;font-weight:600}
.divider{width:60px;height:2px;background:#C49A3C;margin:24px auto}
.info{font-size:13px;color:#aaa;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 36px;background:#1A2744;color:#fff;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:4px;transition:.3s}
.btn:hover{background:#C49A3C;transform:translateY(-2px)}
.footer{margin-top:32px;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="card">
<div class="icon"><i class="fas fa-check"></i></div>
<h1>Thank You!</h1>
<p>Your message has been <span class="highlight">successfully sent</span>.</p>
<p>Our design team will get back to you within <span class="highlight">24 hours</span>.</p>
<div class="divider"></div>
<p class="info">If you need immediate assistance, call us at<br><strong style="color:#2C2C2C">+91 9757092812</strong></p>
<a href="/" class="btn"><i class="fas fa-arrow-left"></i> Back to Website</a>
<div class="footer">TechnoTouch Interio Pvt Ltd</div>
</div>
</body>
</html>
